name: Verify anonymous multiplayer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multiplayer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
          enable-cache: true
      - run: uv python install 3.12.13
      - run: uv sync --project backend --locked --python 3.12.13
      - run: npm ci
      - run: npm run check && npm run infra:check
      - run: uv run --locked --project backend ruff check backend && uv run --locked --project backend ruff format backend --check
      - run: uv run --locked --project backend pyright --project backend/pyproject.toml
      - run: uv run --locked --project backend mypy --config-file backend/pyproject.toml backend/src backend/tests
      - run: uv run --locked --project backend app-archlint
      - run: npm run data:check && npm run test:physics-parity
      - run: npm run infra:synth
      - run: python tools/quintflow.py setup && python tools/portable_python.py setup
      - run: npm run docs:check
      - run: uv run --locked --project backend pytest backend/tests --cov=app --cov-report=term-missing
      - run: PUBLIC_API_BASE=http://127.0.0.1:4322/api npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:online
      - run: npm run build:aws
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiplayer-evidence
          path: |
            test-results/
            docs/design/generated/
            cdk.out/BiribiriMultiplayer.template.json
          retention-days: 14
